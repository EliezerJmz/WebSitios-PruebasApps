<p-toast />
<p-confirmPopup />
<div class="layout-topbar back-topbar">
    
    <button type="button" title="Menu" #menubutton class="p-link layout-menu-button layout-topbar-button" (click)="onMenuButtonClick($event)">
        <i class="pi pi-bars menu-icon"></i>
    </button>

    <a  class="layout-topbar-logo ml-15" routerLink="/dashboard">
        <span class="titulo">Web Sitios S.I.</span>
    </a>

    <button type="button" title="Menu" #topbarmenubutton class="p-link layout-topbar-menu-button layout-topbar-button" (click)="layoutService.showProfileSidebar()">
        <i class="pi pi-ellipsis-v menu-icon"></i>
    </button>

    <div #topbarmenu class="layout-topbar-menu" [ngClass]="{'layout-topbar-menu-mobile-active': layoutService.state.profileSidebarVisible}" >
        <div class="contenedor">
            <div class="caja">
                <p-button label="{{this.user}}" icon="pi pi-user" severity="warning"  />
            </div>
            <div class="caja">
                <p-button label="{{this.rol}}"  icon="pi pi-list" severity="warning"  />
            </div>
            <div class="caja">
                <p-button label="Cerrar Sesión" severity="warning" (onClick)="confirmLogout($event)" icon="pi pi-sign-out" />
            </div>
        </div>
    </div>
</div>
