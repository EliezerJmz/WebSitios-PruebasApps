<div class="flex align-items-center justify-content-center min-h-screen">

    <div class="py-6 px-5 sm:px-5 card2" >

        <div class="text-center">
            <img src="assets/layout/images/ClaroBlanco.svg" alt="Image" height="55" class="mb-4">
            <div>
                <h1 class="tw">
                    Web Sitios Seguridad Industrial
                </h1>
            </div>
            <hr>
            <p class="tw2">Inicie sesión con su usuario de red.</p>
        </div>

        <form [formGroup]="loginForm" class="p-fluid" autocomplete="off" (ngSubmit)="onLogin()" >
             <div class=" py-4 px-4 sm:px-4  card" >
                <div>
                    <div class=" mb-3">
                        <label for="username" class="block font mb-1">Usuario</label>
                        <input id="username" formControlName="username" (focus)="invalidCredentials = null" type="text" placeholder="Usuario" pInputText class="w-full md:w-30rem p-rem-1 font" required>
                        <div class="p-error block pt-1 pm-0" *ngIf="this.loginForm.get('username')?.errors?.['required'] && !this.loginForm.get('username')?.pristine">
                            Usuario Requerido
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="block font mb-1">Contraseña</label>
                        <p-password id="password"  formControlName="password" placeholder="Contraseña" [toggleMask]="true" [feedback]="false" inputStyleClass="w-full p-3 md:w-30rem font" (onFocus)="invalidCredentials = null"></p-password>
                        <div class="p-error block pt-1" *ngIf="this.loginForm.get('password')?.errors?.['required'] && !this.loginForm.get('password')?.pristine">
                            Contraseña Requerida
                        </div>
                    </div>

                    <div>
                        <button  type="submit" pButton pRipple label="Iniciar Sesión" title="Iniciar sesión con usuario de red. "  icon="pi pi-sign-in" iconPos="right" class="w-full p-3 text-xl custom-red-button"  [disabled]="loginForm.invalid" ></button>
                        <div class="p-error block pt-2" *ngIf="invalidCredentials">
                            {{ invalidCredentials }}
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="block font mb-1">Inicie Sesión con</label>
                        <button type="button" pButton pRipple label="Office 365" title="Iniciar sesión con Office 365." icon="pi pi-microsoft" iconPos="right" class="w-full p-3 text-xl custom-button" (click)="redirectToSaml()"></button>
                    </div>

                </div>
            </div>
        </form>
    </div>
</div>
