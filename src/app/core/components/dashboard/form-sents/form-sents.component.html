<h3>Formularios Enviados</h3>

<p-toast></p-toast>
<p-confirmDialog key="formSentsDialog" />
<p-table [value]="formularios" 
    [tableStyle]="{'min-width': '20rem'}"  
    [paginator]="true"
    [rows]="6"
    [pageLinks]="3"
    >
    <ng-template pTemplate="header">
        <tr>
            <th pSortableColumn="name" >
                Nombre <p-sortIcon field="name" />
            </th>
            <th pSortableColumn="fecha" >
                Fecha <p-sortIcon field="fecha" />
            </th>
            <th pSortableColumn="status" >
                Estado <p-sortIcon field="status" />
            </th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-formulario>
        <tr>
            <td>{{formulario.name}}</td>
            <td>{{formulario.fecha}}</td>
            <td><p-tag [value]="formulario.status" [severity]="getSeverity(formulario.status)" /></td>
        </tr>
    </ng-template>
    <ng-template pTemplate="summary">
        <div class="flex align-items-center justify-content-between">
            En total Hay {{formularios ? formularios.length : 0 }} Formularios.
        </div>
    </ng-template>
</p-table>

<div class="grid pt-3">
    <div class="col-12 xl:col-12">
        <p-button severity="warning" label="Botón de Pánico" styleClass="w-full" (onClick)="confirmMessage()" />
    </div>
</div>
