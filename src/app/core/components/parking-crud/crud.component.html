<p-toast></p-toast>
<p-confirmDialog />
<div class="grid m-0">

        <div id="panel" class="col-12 p-0">
            <h4 class="text-center pt-3">Formulario ATS</h4>
            <p-accordion>
                <p-accordionTab header="Datos de la Empresa" headerStyleClass="registro-tab header-lg">
                    <div class="card">
                        <div>
                            <label class="label" for="emp">Nombre de la Empresa</label>
                            <input id="emp" type="text" pInputText class="w-full" [(ngModel)]="valueEmp" />
                        </div>
                
                        <div class="mt-3">
                            <label class="label" for="id">ID del Sitio</label>
                            <div class="flex gap-2 align-items-center">
                                <input id="id" type="text" pInputText class="flex-1" [(ngModel)]="valueId" />
                                <p-button type="button" label="Buscar" icon="pi pi-search" styleClass="p-button-info" />
                            </div>
                        </div>
                    </div>
                    <div class="card mt-3">
                        <div class="flex align-items-center gap-3">
                            <label class="label mb-0" for="id">ID del Sitio:</label>
                            <p class="p m-0">1001</p>
                        </div>
                        <div class="flex align-items-center gap-3 mt-2">
                            <label class="label mb-0" for="nombre">Nombre del Sitio:</label>
                            <p class="p m-0">Central Centro</p>
                        </div>
                    </div>
                 
                    <div class="mt-3 mt-3">
                        <label class="label" for="id">Código IVR</label>
                        <div class="flex gap-2 align-items-center">
                            <input id="id" type="text" pInputText class="flex-1" [(ngModel)]="valueId" />
                            <p-button type="button" label="Buscar" icon="pi pi-search" styleClass="p-button-info" />
                        </div>
                    </div>
                    
                     <div class="card mt-3">
                        <label class="label" for="id">Descripción del trabajo a realizar</label>
                        <textarea 
                            placeholder="Escriba la descripción aquí..." 
                            id="description"
                            rows="5"
                            pInputTextarea 
                            class="w-full"
                            [(ngModel)]="valueTextArea">
                        </textarea>
                   </div>
                </p-accordionTab>
                <p-accordionTab header="Fotografía del Rostro con Ubicación" headerStyleClass="registro-tab header-lg">
                   <div class="card">
                        <div class="flex flex-column align-items-center mt-2">
                            <p-button type="button" label="Tomar Foto" icon="pi pi-camera" styleClass="p-button-info mb-3" />
                            <p-image 
                                src="https://plus.unsplash.com/premium_photo-1664474619075-644dd191935f?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8aW1hZ2V8ZW58MHx8MHx8fDA%3D" 
                                alt="Image" 
                                width="250" />
                        </div>
                        <app-upload-photo></app-upload-photo>
                    </div>
                     <div class="card">
                        <div class="flex flex-column align-items-center mt-2">
                            <p-button type="button" label="Obtener Ubicación" icon="pi pi-map-marker" styleClass="p-button-info mb-3" />
                        </div>

                        <div class="card mt-3">
                            <div class="flex align-items-center gap-3">
                                <label class="label mb-0" for="id">Latitud:</label>
                                <p class="p m-0">14.001144</p>
                            </div>
                            <div class="flex align-items-center gap-3 mt-2">
                                <label class="label mb-0" for="nombre">Longitud:</label>
                                <p class="p m-0">-90.251389</p>
                            </div>
                            <div class="flex align-items-center gap-3 mt-2">
                                <label class="label mb-0" for="nombre">Presición:</label>
                                <p class="p m-0">12.0012 metros</p>
                            </div>
                        </div>

                        <div class="card">
                            <div>
                                <label class="label" for="emp">Número de Orden de Trabajo</label>
                                <input id="emp" type="text" placeholder="Ingrese Número de Orden..."  pInputText class="w-full" [(ngModel)]="valueEmp" />
                            </div>
                    
                           
                        </div>

                    </div>


                    
                </p-accordionTab>
                <p-accordionTab header="Análisis de Riesgo" headerStyleClass="registro-tab header-lg">
                    <p>
                        Contenido del tercer panel del acordeón.
                    </p>
                </p-accordionTab>
                 <p-accordionTab header="Permisos de Trabajo" headerStyleClass="registro-tab header-lg">
                    <p>
                        Contenido del tercer panel del acordeón.
                    </p>
                </p-accordionTab>
                  <p-accordionTab header="Fotografía Herramientas" headerStyleClass="registro-tab header-lg">
                    <p>
                        Contenido del tercer panel del acordeón.
                    </p>
                </p-accordionTab>
                 <p-accordionTab header="Fotografía Equipo de Protección" headerStyleClass="registro-tab header-lg">
                    <p>
                        Contenido del tercer panel del acordeón.
                    </p>
                </p-accordionTab>
                 <p-accordionTab header="Medidas de prevención" headerStyleClass="registro-tab header-lg">
                    <p>
                        Contenido del tercer panel del acordeón.
                    </p>
                </p-accordionTab>
            </p-accordion>
        </div>

        <div class="grid pt-3">
            <div class="col-6 xl:col-6">
                <p-button type="submit" severity="primary" label="Enviar" styleClass="w-full" (onClick)="confirmSubmitFormATS()" />
            </div>
            <div class="col-6 xl:col-6">
                <p-button severity="warning" label="Cancelar" styleClass="w-full" (onClick)="confirmCancelFormATS()" />
            </div>
        </div>
