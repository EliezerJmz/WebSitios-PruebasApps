<h3 (click)="FormulariosEnviados()" class="titulo-refresh">Formularios Enviados</h3>

<p-toast></p-toast>
<p-confirmDialog key="formSentsDialog" />
<div *ngIf="loading" class="flex justify-content-center align-items-center py-4">
    <p-progressSpinner strokeWidth="4" styleClass="spinner-sm" />
</div>

<p-table *ngIf="!loading" [value]="formularios" 
    [tableStyle]="{'min-width': '20rem'}"  
    [paginator]="true"
    [rows]="6"
    [pageLinks]="3"
    >
    <ng-template pTemplate="header">
        <tr>
            <th pSortableColumn="formNombre" >
                Nombre <p-sortIcon field="formNombre" />
            </th>
            <th pSortableColumn="creadoEn" >
                Fecha <p-sortIcon field="creadoEn" />
            </th>
            <th pSortableColumn="estado" >
                Estado <p-sortIcon field="estado" />
            </th>
            <th>Acciones</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-formulario>
        <tr>
            <td>{{formulario.formNombre}}</td>
            <td>{{formulario.creadoEn | date:'dd/MM/yyyy HH:mm'}}</td>
            <td>
                <p-tag
                    [value]="formulario.estado"
                    [severity]="getSeverity(formulario.estado)"
                    [ngClass]="{'tag-clickable': formulario.estado === 'RECHAZADO'}"
                    (click)="formulario.estado === 'RECHAZADO' && editarFormulario(formulario)"
                    [pTooltip]="formulario.estado === 'RECHAZADO' ? 'Editar formulario' : null"
                    tooltipPosition="top" />
            </td>
            <td>
                <p-button
                    icon="pi pi-eye"
                    severity="info"
                    size="small"
                    (onClick)="verFormulario(formulario)"
                    pTooltip="Ver respuestas"
                    tooltipPosition="top" />
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="summary">
        <div class="flex align-items-center justify-content-between">
            En total Hay {{formularios ? formularios.length : 0 }} Formularios.
        </div>
    </ng-template>
</p-table>

<div class="grid pt-3">
    <div class="col-12 xl:col-12">
        <p-button severity="warning" label="Botón de Pánico" styleClass="w-full" (onClick)="confirmMessage()" />
    </div>
</div>
